<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UT-AI智能助手</title>
    <link rel="stylesheet" href="//frame.usualtool.com/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="//frame.usualtool.com/assets/css/ai.css">
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="//cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="//frame.usualtool.com/baike/assets/js/md5.js"></script>
    <script src="//frame.usualtool.com/baike/assets/js/time.js"></script>
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">你好！我是你的 AI 助手。请问有什么我可以帮你的吗？</div>
    </div>
    <div class="input-area">
        <div class="input-group" style="max-width: 800px; margin: 0 auto;">
            <textarea id="userInput" class="form-control" placeholder="输入你的问题... (Shift+Enter 换行)" rows="1" style="resize: none; overflow-y: hidden;"></textarea>
            <div class="input-group-append">
                <button class="btn btn-primary" type="button" id="sendBtn">发送</button>
            </div>
        </div>
    </div>
    <script src="//frame.usualtool.com/assets/js/jquery.min.js"></script>
    <script>
        //请在/vendor/usualtool/ut-ai/src/.env中进行初始设置
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        marked.setOptions({
            gfm: true,
            breaks: true,
            smartLists: true,
            highlight: function(code, lang) {
                try {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language }).value;
                } catch (e) {
                    return code;
                }
            }
        });
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
        function safeRenderMarkdown(rawText) {
            let text = rawText;
            const fenceCount = (text.match(/^\x60\x60\x60/gm) || []).length;
            if (fenceCount % 2 !== 0) { text += '\n\x60\x60\x60'; }
            const inlineCodeCount = (text.match(/`/g) || []).length;
            if (inlineCodeCount % 2 !== 0) { text += '`'; }
            const openTags = ['<table', '<ul', '<ol', '<div'];
            const closeTags = ['</table>', '</ul>', '</ol>', '</div>'];
            for (let i = 0; i < openTags.length; i++) {
                const openCount = (text.match(new RegExp(openTags[i], 'gi')) || []).length;
                const closeCount = (text.match(new RegExp(closeTags[i], 'gi')) || []).length;
                if (openCount > closeCount) { text += closeTags[i]; }
            }
            return marked.parse(text);
        }
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.disabled = true;
            sendBtn.disabled = true;
            const aiMessageDiv = document.createElement('div');
            aiMessageDiv.className = 'message ai-message';
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'thinking-process';
            thinkingDiv.style.display = 'none';
            thinkingDiv.innerHTML = `
                <div class="thinking-header">
                    <span class="thinking-arrow">▶</span>
                    <span class="thinking-label">深度思考中...</span>
                </div>
                <div class="thinking-body">
                    <div class="md-content"></div>
                </div>
            `;
            const contentDiv = document.createElement('div');
            contentDiv.className = 'md-content';
            contentDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            aiMessageDiv.appendChild(thinkingDiv);
            aiMessageDiv.appendChild(contentDiv);
            chatContainer.appendChild(aiMessageDiv);
            scrollToBottom();
            const thinkingHeader = thinkingDiv.querySelector('.thinking-header');
            const thinkingArrow = thinkingDiv.querySelector('.thinking-arrow');
            const thinkingBody = thinkingDiv.querySelector('.thinking-body');
            thinkingHeader.addEventListener('click', function() {
                thinkingBody.classList.toggle('show');
                thinkingArrow.classList.toggle('expanded');
            });
            let isThinking = false;
            let rawThinkingText = '';
            let rawAnswerText = '';
            try {
                const response = await fetch('?m=ut-api&p=data-robot', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'time': getnowdate(),
                        'token': md5("ut-api应用ApiKey"+gettimestamp())//ApiKey通过可视包/dev/ut-api查看
                    },
                    body: JSON.stringify({
                        model: 'glm-5v-turbo',//选用模型需在/vendor/usualtool/ut-ai/src/.env模型范围内
                        messages: [{ role: 'user', content: text }],
                        stream: true
                    })
                });
                if (!response.ok) throw new Error('HTTP error! status: ' + response.status);
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || trimmed.indexOf('data:') !== 0) continue;
                        const jsonStr = trimmed.slice(5).trim();
                        if (jsonStr === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(jsonStr);
                            if (parsed.choices && parsed.choices[0] && parsed.choices[0].delta) {
                                const delta = parsed.choices[0].delta;
                                if (delta.reasoning_content) {
                                    if (!isThinking) {
                                        isThinking = true;
                                        thinkingDiv.style.display = 'block';
                                        if (!thinkingBody.classList.contains('show')) {
                                            thinkingBody.classList.add('show');
                                            thinkingArrow.classList.add('expanded');
                                        }
                                    }
                                    rawThinkingText += delta.reasoning_content;
                                    const thinkingContent = thinkingDiv.querySelector('.md-content');
                                    thinkingContent.innerHTML = safeRenderMarkdown(rawThinkingText);
                                    scrollToBottom();
                                }
                                if (delta.content) {
                                    if (isThinking) {
                                        isThinking = false;
                                        thinkingBody.classList.remove('show');
                                        thinkingArrow.classList.remove('expanded');
                                        thinkingDiv.querySelector('.thinking-label').textContent = '思考过程 (点击展开)';
                                    }
                                    rawAnswerText += delta.content;
                                    contentDiv.innerHTML = safeRenderMarkdown(rawAnswerText);
                                    addCopyButtons(contentDiv);
                                    scrollToBottom();
                                }
                            }
                            else if (parsed.type && parsed.data !== undefined) {
                                switch (parsed.type) {
                                    case 'reasoning':
                                    case 'thought':
                                        if (thinkingDiv.style.display === 'none') {
                                            thinkingDiv.style.display = 'block';
                                            if (!thinkingBody.classList.contains('show')) {
                                                thinkingBody.classList.add('show');
                                                thinkingArrow.classList.add('expanded');
                                            }
                                        }
                                        rawThinkingText += parsed.data;
                                        const thinkingContent = thinkingDiv.querySelector('.md-content');
                                        thinkingContent.innerHTML = safeRenderMarkdown(rawThinkingText);
                                        scrollToBottom();
                                        break;
                                    case 'answer':
                                        if (isThinking) {
                                            isThinking = false;
                                            thinkingBody.classList.remove('show');
                                            thinkingArrow.classList.remove('expanded');
                                            thinkingDiv.querySelector('.thinking-label').textContent = '思考过程 (点击展开)';
                                        }
                                        rawAnswerText += parsed.data;
                                        contentDiv.innerHTML = safeRenderMarkdown(rawAnswerText);
                                        addCopyButtons(contentDiv);
                                        scrollToBottom();
                                        break;
                                    case 'done':
                                        break;
                                    default:
                                        break;
                                }
                            }
                        } catch (e) {
                            console.warn('JSON解析失败:', e);
                        }
                    }
                }
                const loader = contentDiv.querySelector('.typing-indicator');
                if (loader) loader.remove();
                if (!isThinking && thinkingDiv.style.display !== 'block') {
                    thinkingDiv.remove();
                }
            } catch (error) {
                console.error('请求异常:', error);
                contentDiv.innerHTML = '<span style="color:red">发生错误: ' + error.message + '</span>';
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + sender + '-message';
            messageDiv.innerHTML = marked.parse(text);
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        function addCopyButtons(element) {
            element.querySelectorAll('pre').forEach((pre) => {
                if (pre.querySelector('.copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.innerText = '复制';
                btn.onclick = () => {
                    const code = pre.querySelector('code');
                    navigator.clipboard.writeText(code ? code.innerText : pre.innerText);
                    btn.innerText = '已复制';
                    setTimeout(() => btn.innerText = '复制', 2000);
                };
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });
        }
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
